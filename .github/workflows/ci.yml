name: CI

# Enterprise quality gate (see docs/deployment/ci-pipeline.md): every push to
# main/develop and every PR into them runs lint, test, security, and build as
# four independently-reported jobs, then `quality-gate` requires all four to
# have passed. Configure branch protection on `main`/`develop` to require the
# `quality-gate` check — see that doc for exactly how and why.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `prisma generate` (part of @iecp/database's build script, which every other
  # package/app/service depends on via turbo.json's `dependsOn: ["^build"]`)
  # resolves env("DATABASE_URL") at schema-parse time even though it never
  # connects — a placeholder is enough for lint/typecheck/build. The `test` job
  # below overrides this at the job level with real iecp_migrator/iecp_app
  # connection strings, for the steps that need a reachable Postgres.
  DATABASE_URL: 'postgresql://iecp_app:change-me-app@localhost:5432/iecp?schema=public'
  JWT_SECRET: 'ci-placeholder-secret'
  # identity module (Phase 004) config — see services/api/src/config/env.ts.
  # Only the `test` job's e2e step actually boots the app and needs these
  # (lint/build never do), but they're set at the workflow level to match
  # how DATABASE_URL/JWT_SECRET above are already handled, rather than
  # introducing a different pattern for this one job. ENCRYPTION_KEY is a
  # CI-only placeholder (AES-256-GCM key, base64-decodes to 32 bytes) — not
  # a real secret, never reused anywhere that matters.
  JWT_ACCESS_TTL_SECONDS: '900'
  JWT_REFRESH_TTL_SECONDS: '2592000'
  OTP_TTL_SECONDS: '300'
  ENCRYPTION_KEY: 'tHHpI4F9SlwcT/iC5YXigwpcjLGD8okpxIEKhNRZAWM='

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository structure
        run: pnpm validate:structure

      - name: ESLint
        run: pnpm lint

      - name: Prettier check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      # Bootstrapped as the superuser (`postgres`) so the "Bootstrap schemas
      # and least-privilege roles" step below can create iecp_migrator/
      # iecp_app the same way infrastructure/postgres/init/*.sql does for
      # every other environment — nothing after that step connects as
      # `postgres` again.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iecp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iecp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # iecp_migrator: DDL — migrations and seed run under this role, same
      # as local dev (packages/database/.env.example).
      MIGRATOR_DATABASE_URL: 'postgresql://iecp_migrator:change-me-migrator@localhost:5432/iecp?schema=public'
      # iecp_app: DML only — overrides the workflow-level placeholder for
      # this job. services/api's e2e suite runs under this role on purpose:
      # it's what production actually grants the running service, so a test
      # that only passes with iecp_migrator's extra DDL rights would be
      # masking a real deployment bug. See
      # docs/database/README.md#roles--least-privilege.
      DATABASE_URL: 'postgresql://iecp_app:change-me-app@localhost:5432/iecp?schema=public'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Bootstrap schemas and least-privilege roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d iecp -f infrastructure/postgres/init/01-schemas.sql
          psql -h localhost -U postgres -d iecp -f infrastructure/postgres/init/02-roles.sql

      - name: Apply migrations (iecp_migrator)
        run: pnpm --filter @iecp/database exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.MIGRATOR_DATABASE_URL }}

      - name: Seed (regression check — fails if seed.ts drifts out of sync with schema.prisma)
        run: pnpm --filter @iecp/database seed
        env:
          DATABASE_URL: ${{ env.MIGRATOR_DATABASE_URL }}

      - name: Integration tests (services/api e2e, against real Postgres, iecp_app role)
        run: pnpm --filter @iecp/api test:e2e

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the working tree

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency scan (pnpm audit, high+critical only)
        # `pnpm audit` fails the step itself on a match at/above --audit-level;
        # low/moderate transitive advisories are common and often unactionable
        # without an upstream fix, so they're reported, not gate-blocking.
        run: pnpm audit --audit-level high

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend build (apps/*)
        run: pnpm turbo run build --filter="./apps/*"

      - name: Backend build (services/*)
        run: pnpm turbo run build --filter="./services/*"

  quality-gate:
    name: quality gate
    runs-on: ubuntu-latest
    needs: [lint, test, security, build]
    if: always()
    steps:
      - name: Require lint, test, security, and build to have all passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required checks failed — see the lint/test/security/build jobs above."
            exit 1
          fi
          echo "All required checks passed."
