packages:
  - 'apps/*'
  - 'services/*'
  - 'packages/*'
overrides:
  # @nestjs/swagger@11.4.6 depends directly on the vulnerable js-yaml@5.2.1
  # (GHSA-pm4m-ph32-ghv5, exponential parsing time / DoS) — force the patched
  # line everywhere until @nestjs/swagger bumps its own dependency. Caught by
  # the `security` CI job's `pnpm audit --audit-level high`; remove this once
  # that job passes without it.
  js-yaml@>=5.0.0 <5.2.2: '>=5.2.2'
  # prisma@6.19.3's own @prisma/config depends on deepmerge-ts@7.1.5, which
  # has a stack-exhaustion DoS on recursive object graphs
  # (GHSA-ggr8-5vv4-36mx) — force the patched >=8.0.0 line. Found by Phase
  # 009's own `pnpm audit --audit-level high` run; remove this once Prisma
  # bumps its own dependency.
  deepmerge-ts@<8.0.0: '>=8.0.0'
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  argon2: true # native binding (password hashing, services/api identity module) — no postinstall script runs without this
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true
