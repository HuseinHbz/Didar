# Local development Redis config. Redis here is cache + BullMQ queues + rate
# limiting + sessions ONLY — never a source of truth (blueprint §126). Losing
# this data should degrade the system, not corrupt it, which is why persistence
# below is best-effort (AOF) rather than tuned for durability.

appendonly yes
appendfsync everysec

# Reasonable dev cap — evicts least-recently-used keys once full instead of
# erroring writes. Tune per-environment in a real deployment.
maxmemory 256mb
maxmemory-policy allkeys-lru
