# Reverse proxy in front of storefront/admin/api for local multi-service testing
# or as a starting point for a real edge config (blueprint §5/§114: CDN/WAF in
# front of this in production — this file only covers the Nginx layer).
#
# ⚠️ Not deployed/tested anywhere yet. Hostnames below assume Docker Compose
# service names (see infrastructure/docker/docker-compose.yml) — swap for real
# upstream addresses in an actual environment.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain application/json application/javascript text/css;

  # Generic reasonable rate limit — tune per-route in a real deployment
  # (blueprint §55/§100: rate limiting is a named security requirement).
  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

  upstream storefront_upstream {
    server storefront:3000;
  }

  upstream admin_upstream {
    server admin:3001;
  }

  upstream api_upstream {
    server api:4000;
  }

  server {
    listen 80;
    server_name _;

    limit_req zone=general burst=40 nodelay;

    location /api/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
      proxy_pass http://admin_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://storefront_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
